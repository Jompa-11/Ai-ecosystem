<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Medeltida AI-Ekosystem</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Karta -->
  <canvas id="world"></canvas>

  <!-- Topbar (din exakta bild) med live-värden ovanpå -->
  <div id="topbar-wrap">
    <img id="topbar" src="assets/ui/topbar.png" alt="Dashboard" />
    <span class="stat-val" id="val-sold"></span>
    <span class="stat-val" id="val-apiCost"></span>
    <span class="stat-val" id="val-tokens"></span>
    <span class="stat-val" id="val-revenue"></span>
  </div>

  <!-- Agent-panel (din exakta bild, fällbar) -->
  <aside id="sidebar">
    <img id="panelImg" src="assets/ui/panel.png" alt="Agenter" />
    <button id="agentsToggle" title="Fäll in"></button>
  </aside>
  <button id="agentsReopen" title="Visa agenter">&#8250;</button>

  <!-- Zoom-kontroller -->
  <div id="controls">
    <button id="zoomIn" title="Zooma in">+</button>
    <button id="zoomOut" title="Zooma ut">&#8722;</button>
    <button id="reset" title="Återställ vy">&#10226;</button>
  </div>

  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
